<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="無機化学一問一答">
<meta name="theme-color" content="#1c2027">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>無機化学 一問一答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2027;
    --surface:#262b34;
    --surface-alt:#323847;
    --paper:#f3efe6;
    --muted:#9aa0ad;
    --flame-ca:#e2703a;
    --flame-cu:#4fb8a6;
    --flame-k:#9b84d9;
    --flame-na:#e8c547;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif;
    min-height:100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:20px 18px 40px;}
  h1,h2,h3{font-family:'Zen Old Mincho',serif;margin:0;}
  button{font-family:inherit;}

  /* ---------- HOME ---------- */
  .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .home-title{font-size:25px;font-weight:700;color:var(--paper);line-height:1.4;}
  .home-sub{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7;}

  .cta{
    margin-top:20px;background:var(--flame-ca);color:var(--ink);border:none;border-radius:14px;
    padding:17px 20px;display:flex;align-items:center;justify-content:space-between;width:100%;
    cursor:pointer;transition:transform .15s ease;
  }
  .cta:active{transform:scale(.97);}
  .cta .cta-eyebrow{font-size:10.5px;letter-spacing:.1em;opacity:.75;font-weight:700;}
  .cta .cta-main{font-family:'Zen Old Mincho',serif;font-size:18px;font-weight:600;margin-top:4px;}
  .cta .cta-arrow{font-size:22px;font-weight:700;}
  .cta.secondary{background:var(--surface);border:1px solid var(--flame-cu);color:var(--flame-cu);}
  .cta.secondary .cta-eyebrow{color:var(--flame-cu);opacity:.85;}
  .cta.secondary.disabled{border-color:var(--surface-alt);color:var(--muted);cursor:default;}
  .cta.secondary.disabled .cta-eyebrow{color:var(--muted);}

  .part-header{
    margin-top:28px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;
  }
  .part-header .part-no{font-family:'Zen Old Mincho',serif;font-size:13px;color:var(--part-accent);font-weight:700;}
  .part-header .part-name{font-size:14px;color:var(--paper);font-weight:700;}
  .part-header .part-en{font-size:10px;color:var(--muted);letter-spacing:.08em;}
  .part-header::after{content:"";flex:1;height:1px;background:var(--surface-alt);align-self:center;}

  .tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .tile{
    border-radius:12px;background:var(--surface);border:1px solid var(--surface-alt);
    padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;
    transition:transform .15s ease;text-align:left;min-height:100px;
  }
  .tile:active{transform:scale(.96);}
  .tile .idx{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .tile .sym{font-family:'Zen Old Mincho',serif;font-size:24px;font-weight:700;line-height:1;color:var(--accent);}
  .tile .name{font-size:12px;color:var(--paper);line-height:1.35;flex:1;}
  .tile .rate{font-size:10px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;}

  .reset-link{margin-top:28px;text-align:center;font-size:11.5px;color:var(--muted);background:none;border:none;text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
  .reset-confirm{margin-top:14px;background:var(--surface);border:1px solid var(--surface-alt);border-radius:10px;padding:14px;font-size:12.5px;color:var(--muted);text-align:center;}
  .reset-confirm .row{display:flex;gap:10px;margin-top:10px;}
  .reset-confirm button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--surface-alt);background:var(--ink);color:var(--paper);font-size:12.5px;cursor:pointer;}
  .reset-confirm button.danger{background:var(--flame-ca);color:var(--ink);border-color:var(--flame-ca);font-weight:700;}

  /* ---------- QUIZ ---------- */
  .quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .back-btn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 0;}
  .counter{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .progress-track{height:4px;border-radius:2px;background:var(--surface-alt);overflow:hidden;margin-bottom:20px;}
  .progress-fill{height:100%;background:var(--cat-accent, var(--flame-ca));transition:width .3s ease;}
  .cat-tag{display:inline-block;font-size:11px;color:var(--cat-accent, var(--flame-ca));border:1px solid var(--cat-accent, var(--flame-ca));border-radius:999px;padding:3px 10px;margin-bottom:16px;margin-right:6px;}
  .type-tag{display:inline-block;font-size:10.5px;color:var(--muted);background:var(--surface-alt);border-radius:999px;padding:3px 9px;margin-bottom:16px;vertical-align:middle;}
  .card{background:var(--surface);border:1px solid var(--surface-alt);border-top:3px solid var(--cat-accent, var(--flame-ca));border-radius:14px;padding:24px 20px;min-height:220px;display:flex;flex-direction:column;}
  .qa-label{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;}
  .qa-text{font-size:17px;line-height:1.75;color:var(--paper);flex:1;}
  .qa-divider{height:1px;background:var(--surface-alt);margin:18px 0;}
  .reveal-btn{margin-top:20px;width:100%;padding:16px;border-radius:12px;border:1px solid var(--surface-alt);background:var(--surface-alt);color:var(--paper);font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s ease;}
  .reveal-btn:active{transform:scale(.98);}
  .mark-row{display:flex;gap:10px;margin-top:20px;}
  .mark-btn{flex:1;padding:16px 8px;border-radius:12px;border:1px solid var(--surface-alt);background:var(--ink);color:var(--paper);font-size:14.5px;font-weight:700;cursor:pointer;transition:transform .15s ease, background .15s ease, border-color .15s ease;}
  .mark-btn:active{transform:scale(.96);}
  .mark-btn.wrong:active{background:var(--flame-ca);border-color:var(--flame-ca);color:var(--ink);}
  .mark-btn.correct:active{background:var(--flame-cu);border-color:var(--flame-cu);color:var(--ink);}
  .tf-verdict{font-family:'Zen Old Mincho',serif;font-size:17px;font-weight:700;}
  .tf-verdict.correct{color:var(--flame-cu);}
  .tf-verdict.wrong{color:var(--flame-ca);}

  /* ---------- RESULT ---------- */
  .result-score{text-align:center;margin-top:10px;}
  .result-score .num{font-family:'Zen Old Mincho',serif;font-size:42px;font-weight:700;}
  .result-score .pct{font-size:13px;color:var(--muted);margin-top:4px;}
  .review-title{font-size:12px;color:var(--muted);letter-spacing:.1em;margin:26px 0 12px;}
  .review-item{background:var(--surface);border:1px solid var(--surface-alt);border-radius:10px;padding:14px;margin-bottom:10px;font-size:13px;line-height:1.7;}
  .review-item .rq{color:var(--paper);font-weight:700;}
  .review-item .ra{color:var(--flame-cu);margin-top:4px;}
  .perfect-note{text-align:center;color:var(--muted);font-size:13.5px;margin-top:26px;line-height:1.8;}
  .result-actions{display:flex;gap:10px;margin-top:24px;}
  .result-actions button{flex:1;padding:15px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s ease;}
  .result-actions button:active{transform:scale(.97);}
  .btn-retry{background:var(--flame-ca);color:var(--ink);border:none;}
  .btn-home{background:none;color:var(--paper);border:1px solid var(--surface-alt);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ===================== PART (chapter) META ===================== */
const PART_META = {
  nonmetal:   { no:"第２部", name:"非金属元素",     en:"NON-METALS",        accent:"var(--flame-ca)" },
  typical:    { no:"第３部", name:"典型金属元素",   en:"TYPICAL METALS",    accent:"var(--flame-na)" },
  transition: { no:"第４部", name:"遷移元素",       en:"TRANSITION METALS", accent:"var(--flame-cu)" },
  summary:    { no:"総合",   name:"総合・入試頻出", en:"REVIEW & DRILL",    accent:"var(--flame-k)"  },
};
const PART_ORDER = ["nonmetal","typical","transition","summary"];

/* ===================== CATEGORY META ===================== */
const CATEGORY_META = {
  periodic:        { name:"周期表と元素の分類",         short:"周期表・分類",       symbol:"族",  part:"nonmetal" },
  hydrogen:        { name:"水素・貴ガス",               short:"水素・貴ガス",       symbol:"H",   part:"nonmetal" },
  halogen_elem:    { name:"ハロゲンの単体",             short:"ハロゲン単体",       symbol:"X",   part:"nonmetal" },
  halogen_cmpd:    { name:"ハロゲンの化合物",           short:"ハロゲン化合物",     symbol:"HX",  part:"nonmetal" },
  oxygen:          { name:"酸素とその化合物",           short:"酸素",               symbol:"O",   part:"nonmetal" },
  sulfur:          { name:"硫黄とその化合物",           short:"硫黄",               symbol:"S",   part:"nonmetal" },
  nitrogen:        { name:"窒素とその化合物",           short:"窒素",               symbol:"N",   part:"nonmetal" },
  phosphorus:      { name:"リンとその化合物",           short:"リン",               symbol:"P",   part:"nonmetal" },
  carbon:          { name:"炭素の同素体・化合物",       short:"炭素",               symbol:"C",   part:"nonmetal" },
  silicon:         { name:"ケイ素とその化合物",         short:"ケイ素",             symbol:"Si",  part:"nonmetal" },
  alkali:          { name:"アルカリ金属",               short:"アルカリ金属",       symbol:"Na",  part:"typical" },
  alkaline_earth:  { name:"アルカリ土類金属",           short:"アルカリ土類金属",   symbol:"Ca",  part:"typical" },
  aluminum:        { name:"アルミニウム",               short:"アルミニウム",       symbol:"Al",  part:"typical" },
  tin_lead:        { name:"スズ・鉛",                   short:"スズ・鉛",           symbol:"Sn",  part:"typical" },
  transition_intro:{ name:"遷移元素の特徴・錯イオン",   short:"遷移元素・錯イオン", symbol:"錯",  part:"transition" },
  zinc_mercury:    { name:"亜鉛・水銀",                 short:"亜鉛・水銀",         symbol:"Zn",  part:"transition" },
  copper:          { name:"銅",                         short:"銅",                 symbol:"Cu",  part:"transition" },
  silver_gold:     { name:"銀・金",                     short:"銀・金",             symbol:"Ag",  part:"transition" },
  iron:            { name:"鉄",                         short:"鉄",                 symbol:"Fe",  part:"transition" },
  cr_mn_ni:        { name:"クロム・マンガン・ニッケル", short:"Cr・Mn・Ni",         symbol:"Cr",  part:"transition" },
  gas_generation:  { name:"気体の発生と性質",           short:"気体の発生・性質",   symbol:"気",  part:"summary" },
  metal_reactions: { name:"金属単体・イオンの反応",     short:"金属反応まとめ",     symbol:"反",  part:"summary" },
  ion_separation:  { name:"金属イオンの検出と分離",     short:"イオン分離まとめ",   symbol:"沈",  part:"summary" },
};
const CATEGORY_ORDER = ["periodic","hydrogen","halogen_elem","halogen_cmpd","oxygen","sulfur","nitrogen","phosphorus","carbon","silicon","alkali","alkaline_earth","aluminum","tin_lead","transition_intro","zinc_mercury","copper","silver_gold","iron","cr_mn_ni","gas_generation","metal_reactions","ion_separation"];

/* ===================== QUESTION DATA : 一問一答 (QA) ===================== */
const RAW_QA = {
periodic:[
["周期表で1,2,13～18族に属する元素を何というか？","典型元素。金属元素と非金属元素からなる。"],
["周期表で3～12族に属する元素を何というか？","遷移元素。すべて金属元素からなる。"],
["電子を失って陽イオンになりやすい元素(金属元素)を何というか？","陽性元素。"],
["電子を受け取って陰イオンになりやすい元素(貴ガスを除く非金属元素)を何というか？","陰性元素。"],
["典型元素・遷移元素という分け方と、金属元素・非金属元素という分け方は一致するか？","一致しない。"],
["1族のうち水素を除いた元素をまとめて何というか？","アルカリ金属(Li, Na, K, Rb, Cs, Fr)。"],
["2族の元素をまとめて何というか？","アルカリ土類金属(Be, Mg, Ca, Sr, Ba, Ra)。ただしBeとMgは性質が異なる部分が多い。"],
["17族の元素をまとめて何というか？","ハロゲン(F, Cl, Br, I, At)。"],
["18族の元素をまとめて何というか？","貴ガス(He, Ne, Ar, Kr, Xe, Rn)。"],
["常温・常圧で単体が液体として存在する元素は何と何か？","水銀Hgと臭素Br₂の2つだけ。"],
["周期律を確認して周期表をつくり、未発見の元素を予言した人物は誰か？","メンデレーエフ。"],
],
hydrogen:[
["宇宙に最も多く存在する元素は何か？","水素。太陽の質量の約70%を占める。"],
["単体の水素H₂は地球上に天然に多く存在するか？","いいえ、天然にはほとんど存在しない。"],
["水素の捕集法とその理由は？","水上置換法。水に溶けにくいため。"],
["すべての気体の中で密度が最も小さいのは何か？","水素。"],
["水素が空気中で点火して燃えると何色の炎を出し、何になるか？","淡い青色の炎を出し、水H₂Oになる(2H₂+O₂→2H₂O)。"],
["高温で水素が酸化銅(II)と反応する反応式は？","CuO + H₂ → Cu + H₂O(水素が還元剤としてはたらく)。"],
["実験室で亜鉛や鉄に希硫酸(希塩酸)を加えて水素を発生させる反応式は？","Zn + H₂SO₄ → ZnSO₄ + H₂"],
["工業的に水素を製造する方法は？","ニッケル触媒の存在下で炭化水素と水蒸気を反応させる(CH₄+H₂O→CO+3H₂)。"],
["陽性の強い金属元素と水素が結びつくとき、何イオンとしてどんな結合をするか？","水素化物イオンH⁻として、イオン結合で結びつく(例:LiH、CaH₂)。"],
["貴ガス(希ガス)の価電子の数は？","0個。"],
["貴ガスの単体はいずれも何分子か？","単原子分子。"],
["ヘリウムの沸点の特徴と主な利用は？","-269℃ですべての物質の中で最も低い。気球・飛行船のガスや、液体ヘリウムとして極低温の冷媒に利用される。"],
["ネオンの代表的な利用例は？","ネオンサイン(赤橙色の発光)。"],
["アルゴンの空気中の存在割合と主な利用は？","空気中に約1%存在する。電球の封入ガスや溶接・製鋼用の保護ガスに利用される。"],
],
halogen_elem:[
["ハロゲン原子の価電子の数と、なりやすいイオンの価数・種類は？","価電子7個。1価の陰イオンになりやすい。"],
["ハロゲン単体はすべて何分子か？","二原子分子。"],
["ハロゲン単体の酸化力の強さの順は？","F₂ > Cl₂ > Br₂ > I₂。"],
["塩素をヨウ化カリウム水溶液に通じると反応は起こるか？","起こる(2KI+Cl₂→2KCl+I₂)。Cl₂の酸化力がI₂より強いため。"],
["塩化カリウム水溶液に臭素を加えると反応は起こるか？","起こらない。Br₂の酸化力はCl₂より弱いため。"],
["フッ素は水素と冷暗所でどう反応するか？","冷暗所でも爆発的に化合する。"],
["塩素は水素と光を当てるとどう反応するか？","爆発的に化合する。"],
["塩素と水はどのように反応するか？","一部反応してHClとHClO(次亜塩素酸)を生じる。"],
["塩素単体の色と臭いの特徴は？","刺激臭(悪臭)のある黄緑色の気体。"],
["次亜塩素酸HClOの性質と利用は？","分解しやすく酸化力が強い。殺菌・漂白に利用される。"],
["常温・常圧で単体が液体である臭素の色と密度は？","赤褐色の重い液体(密度約3.1g/cm³、25℃)。"],
["臭素の製法は？","臭化カリウムを希硫酸中で酸化マンガン(IV)を用いて酸化する。"],
["ヨウ素単体の色と状態の特徴は？","黒紫色の昇華性の結晶。"],
["ヨウ素は水に溶けにくいが、何に溶けて何色の溶液になるか？","エタノールやヨウ化カリウム水溶液に溶け、褐色の溶液になる。"],
],
halogen_cmpd:[
["ハロゲン化水素の水溶液の酸の強さを強い順に並べると？","HI > HBr > HCl ≫ HF(HFのみ弱酸で、他は強酸)。"],
["塩化水素の水溶液(塩酸)は、硝酸や熱濃硫酸と比べて酸化力はどうか？","塩化水素は硝酸や熱濃硫酸よりも酸化力は弱い。"],
["塩化水素とアンモニアが触れるとどうなるか？","塩化アンモニウムの白煙が生じる(互いの検出反応)。"],
["塩化ナトリウムに濃硫酸を加えて加熱すると塩化水素が発生する。これは何と呼ばれる反応か？","揮発性の酸の遊離(NaCl+H₂SO₄→NaHSO₄+HCl)。"],
["フッ化水素酸(HF)は強酸・弱酸のどちらか、また特徴的に何を溶かすか？","弱酸。ガラスの主成分である二酸化ケイ素SiO₂を溶かす(SiO₂+6HF→H₂SiF₆+2H₂O)。"],
["フッ化水素酸を保存する容器の材質は？","ポリエチレン容器(ガラスを溶かすため使えない)。"],
["フッ化水素の沸点が他のハロゲン化水素より著しく高い理由は？","分子間に水素結合を形成するため。"],
["「弱酸の遊離」の代表例(酢酸ナトリウム+塩酸)の反応式は？","CH₃COONa + HCl → NaCl + CH₃COOH。"],
["「弱塩基の遊離」の代表例(塩化アンモニウム+水酸化ナトリウム)の反応式は？","NH₄Cl + NaOH → NaCl + NH₃ + H₂O。"],
["さらし粉の製法は？","塩素Cl₂を湿った水酸化カルシウムCa(OH)₂に吸収させてつくる(生成物はCaCl(ClO)・H₂O)。"],
["現在生産・販売されている「高度さらし粉」の化学式と主な用途は？","Ca(ClO)₂・2H₂O。殺菌・漂白剤・プールの消毒剤として利用される。"],
["ハロゲン化銀のうち、唯一水に溶けるものはどれか？","フッ化銀AgF(他のAgCl、AgBr、AgIは不溶)。"],
["塩化銀・臭化銀・ヨウ化銀の沈殿の色をそれぞれ答えよ。","AgCl=白色、AgBr=淡黄色、AgI=黄色。"],
["アンモニア水への溶解性がAgClとAgBr、AgIで異なる。どのように異なるか？","AgClはよく溶けるが、AgBrはわずかに溶け、AgIはほとんど溶けない。"],
["オキソ酸のうち、塩素の酸化数が最も大きく最も酸化力が強いものは？","過塩素酸HClO₄(Clの酸化数+7)。"],
["次亜塩素酸HClOは酸化力・酸の強さの点でどのような特徴を持つか？","酸化力は強いが、酸としては弱酸である。"],
],
oxygen:[

/* ===================== STATE ===================== */
let state = { view:"home" };
let statsCache = {};
let missedCache = [];
let resetConfirmOpen = false;

/* ===================== STORAGE HELPERS ===================== */
async function loadAllStats(){
  const result = {};
  for (const cat of CATEGORY_ORDER){
    try{
      const r = await window.storage.get(`stats:${cat}`);
      result[cat] = r ? JSON.parse(r.value) : {attempts:0, correct:0};
    }catch(e){ result[cat] = {attempts:0, correct:0}; }
  }
  statsCache = result;
}

async function loadMissed(){
  try{
    const r = await window.storage.get("missed");
    missedCache = r ? JSON.parse(r.value) : [];
  }catch(e){ missedCache = []; }
}

async function saveMissed(){
  try{ await window.storage.set("missed", JSON.stringify(missedCache)); }catch(e){}
}

function updateMissedFromAnswers(answers){
  const set = new Set(missedCache);
  answers.forEach(a=>{
    if (a.result === "wrong") set.add(a.item.id);
    else set.delete(a.item.id);
  });
  missedCache = Array.from(set);
}

async function saveRoundStats(answers){
  const byCat = {};
  answers.forEach(a=>{
    const c = a.item.cat;
    if(!byCat[c]) byCat[c] = {attempts:0, correct:0};
    byCat[c].attempts += 1;
    if(a.result === "correct") byCat[c].correct += 1;
  });
  for (const [cat, delta] of Object.entries(byCat)){
    const cur = statsCache[cat] || {attempts:0, correct:0};
    const next = { attempts: cur.attempts + delta.attempts, correct: cur.correct + delta.correct };
    statsCache[cat] = next;
    try{ await window.storage.set(`stats:${cat}`, JSON.stringify(next)); }catch(e){}
  }
}

async function resetAllStats(){
  for (const cat of CATEGORY_ORDER){
    statsCache[cat] = {attempts:0, correct:0};
    try{ await window.storage.set(`stats:${cat}`, JSON.stringify(statsCache[cat])); }catch(e){}
  }
  missedCache = [];
  await saveMissed();
  render();
}

/* ===================== HELPERS ===================== */
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}

function startRound(catKey){
  let pool;
  if (catKey === "all"){ pool = shuffle(ALL_QUESTIONS).slice(0,25); }
  else if (catKey === "review"){
    const missedSet = new Set(missedCache);
    pool = shuffle(ALL_QUESTIONS.filter(q=>missedSet.has(q.id)));
    if (pool.length === 0){ goHome(); return; }
  }
  else { pool = shuffle(ALL_QUESTIONS.filter(q=>q.cat===catKey)); }
  state = { view:"quiz", catKey, queue: pool, index: 0, revealed:false, tfChoice:null, answers:[] };
  render();
}

function reveal(){ state.revealed = true; render(); }

function mark(result){
  const item = state.queue[state.index];
  state.answers.push({item, result});
  advance();
}

function answerTf(choiceBool){
  state.tfChoice = choiceBool;
  render();
}

function nextTf(){
  const item = state.queue[state.index];
  const wasCorrect = (state.tfChoice === item.isTrue);
  state.answers.push({item, result: wasCorrect ? "correct" : "wrong"});
  advance();
}

function advance(){
  if (state.index + 1 >= state.queue.length){ finishRound(); }
  else { state.index += 1; state.revealed = false; state.tfChoice = null; render(); }
}

async function finishRound(){
  const correctCount = state.answers.filter(a=>a.result==="correct").length;
  const total = state.answers.length;
  updateMissedFromAnswers(state.answers);
  await Promise.all([ saveRoundStats(state.answers), saveMissed() ]);
  state = { view:"result", catKey: state.catKey, answers: state.answers, correctCount, total };
  render();
}

function goHome(){ resetConfirmOpen = false; state = { view:"home" }; render(); }

/* ===================== RENDER ===================== */
function render(){
  const root = document.getElementById("app");
  if (state.view === "home") root.innerHTML = renderHome();
  else if (state.view === "quiz") root.innerHTML = renderQuiz();
  else if (state.view === "result") root.innerHTML = renderResult();
}

function renderTile(key, idxInPart){
  const meta = CATEGORY_META[key];
  const accent = PART_META[meta.part].accent;
  const s = statsCache[key] || {attempts:0, correct:0};
  const rateText = s.attempts > 0 ? `正答率 ${Math.round(s.correct/s.attempts*100)}%` : "未挑戦";
  return `
    <button class="tile" data-action="start-category" data-key="${key}" style="--accent:${accent}">
      <span class="idx">${String(idxInPart).padStart(2,"0")}</span>
      <span class="sym">${meta.symbol}</span>
      <span class="name">${meta.short}</span>
      <span class="rate">${rateText}</span>
    </button>`;
}

function renderHome(){
  let partsHtml = "";
  PART_ORDER.forEach(partKey=>{
    const part = PART_META[partKey];
    const cats = CATEGORY_ORDER.filter(c=>CATEGORY_META[c].part===partKey);
    const tiles = cats.map((c,i)=>renderTile(c, i+1)).join("");
    partsHtml += `
      <div class="part-header" style="--part-accent:${part.accent}">
        <span class="part-no">${part.no}</span>
        <span class="part-name">${part.name}</span>
        <span class="part-en">${part.en}</span>
      </div>
      <div class="tile-grid">${tiles}</div>
    `;
  });

  const missedCount = missedCache.length;
  const reviewCta = missedCount > 0
    ? `<button class="cta secondary" data-action="start-review">
         <span><span class="cta-eyebrow">REVIEW</span><div class="cta-main">間違えた問題を復習する(${missedCount}問)</div></span>
         <span class="cta-arrow">→</span>
       </button>`
    : `<div class="cta secondary disabled">
         <span><span class="cta-eyebrow">REVIEW</span><div class="cta-main">復習する問題はまだありません</div></span>
       </div>`;

  const resetBlock = resetConfirmOpen ? `
    <div class="reset-confirm">
      学習記録(正答率・復習リスト)をすべて削除します。よろしいですか？
      <div class="row">
        <button data-action="reset-cancel">いいえ</button>
        <button class="danger" data-action="reset-confirm">削除する</button>
      </div>
    </div>` : `<button class="reset-link" data-action="reset-open">記録をリセット</button>`;

  return `
    <div class="eyebrow">高校化学 STUDY</div>
    <h1 class="home-title">無機化学 一問一答</h1>
    <p class="home-sub">周期表・非金属元素・典型金属元素・遷移元素・総合の全23分野。一問一答と正誤(○×)問題の2形式に対応。間違えた問題は自動で「復習」に貯まります。</p>

    <button class="cta" data-action="start-random">
      <span>
        <span class="cta-eyebrow">TODAY'S PRACTICE</span>
        <div class="cta-main">全範囲からランダム25問</div>
      </span>
      <span class="cta-arrow">→</span>
    </button>
    ${reviewCta}

    ${partsHtml}
    ${resetBlock}
  `;
}

function renderQuiz(){
  const total = state.queue.length;
  const item = state.queue[state.index];
  const meta = CATEGORY_META[item.cat];
  const accent = PART_META[meta.part].accent;
  const progressPct = Math.round((state.index / total) * 100);
  const typeLabel = item.type === "tf" ? "正誤問題" : "一問一答";

  const questionArea = item.type === "tf"
    ? `<div class="qa-label">次の記述は正しいか、誤りか</div><div class="qa-text">${item.statement}</div>`
    : `<div class="qa-label">Q</div><div class="qa-text">${item.q}</div>`;

  let bottom;
  if (item.type === "tf"){
    if (state.tfChoice === null){
      bottom = `
        <div class="mark-row">
          <button class="mark-btn wrong" data-action="answer-tf" data-choice="false">✕ 誤り</button>
          <button class="mark-btn correct" data-action="answer-tf" data-choice="true">○ 正しい</button>
        </div>`;
    } else {
      const wasCorrect = (state.tfChoice === item.isTrue);
      bottom = `
        <div class="qa-divider"></div>
        <div class="tf-verdict ${wasCorrect ? "correct" : "wrong"}">${wasCorrect ? "○ 正解！" : "✕ 不正解"}</div>
        <div class="qa-label" style="margin-top:12px;">${item.isTrue ? "この記述は正しい" : "この記述は誤り"}</div>
        <div class="qa-text">${item.explanation || ""}</div>
        <button class="reveal-btn" data-action="next-tf">次の問題へ</button>
      `;
    }
  } else {
    bottom = !state.revealed
      ? `<button class="reveal-btn" data-action="reveal">答えを見る</button>`
      : `
        <div class="qa-divider"></div>
        <div>
          <div class="qa-label">A</div>
          <div class="qa-text">${item.a}</div>
        </div>
        <div class="mark-row">
          <button class="mark-btn wrong" data-action="mark" data-result="wrong">✕ できなかった</button>
          <button class="mark-btn correct" data-action="mark" data-result="correct">○ できた</button>
        </div>
      `;
  }

  return `
    <div class="quiz-top">
      <button class="back-btn" data-action="home">← ホーム</button>
      <span class="counter">問 ${state.index+1} / ${total}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%; --cat-accent:${accent}"></div></div>
    <div style="--cat-accent:${accent}">
      <span class="cat-tag">${meta.symbol}　${meta.name}</span><span class="type-tag">${typeLabel}</span>
      <div class="card" style="--cat-accent:${accent}">
        ${questionArea}
        ${bottom}
      </div>
    </div>
  `;
}

function renderResult(){
  const { correctCount, total, answers, catKey } = state;
  const pct = Math.round((correctCount/total)*100);
  const wrongs = answers.filter(a=>a.result==="wrong");

  const reviewSection = wrongs.length > 0 ? `
    <div class="review-title">復習：間違えた問題</div>
    ${wrongs.map(a=>{
      const it = a.item;
      const qText = it.type === "tf" ? it.statement : it.q;
      const aText = it.type === "tf" ? `${it.isTrue ? "正しい" : "誤り"}。${it.explanation||""}` : it.a;
      return `
      <div class="review-item">
        <div class="rq">Q. ${qText}</div>
        <div class="ra">A. ${aText}</div>
      </div>`;
    }).join("")}
  ` : `<div class="perfect-note">全問正解でした。お見事です。</div>`;

  return `
    <div class="eyebrow">RESULT</div>
    <h2 class="home-title">今回の結果</h2>
    <div class="result-score">
      <div class="num">${correctCount} / ${total}</div>
      <div class="pct">正答率 ${pct}%</div>
    </div>
    ${reviewSection}
    <div class="result-actions">
      <button class="btn-home" data-action="home">ホームへ</button>
      <button class="btn-retry" data-action="retry" data-key="${catKey}">もう一度</button>
    </div>
  `;
}

/* ===================== EVENTS ===================== */
document.getElementById("app").addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "start-random") startRound("all");
  else if (action === "start-review") startRound("review");
  else if (action === "start-category") startRound(el.dataset.key);
  else if (action === "reveal") reveal();
  else if (action === "mark") mark(el.dataset.result);
  else if (action === "answer-tf") answerTf(el.dataset.choice === "true");
  else if (action === "next-tf") nextTf();
  else if (action === "home") goHome();
  else if (action === "retry") startRound(el.dataset.key);
  else if (action === "reset-open"){ resetConfirmOpen = true; render(); }
  else if (action === "reset-cancel"){ resetConfirmOpen = false; render(); }
  else if (action === "reset-confirm"){ resetConfirmOpen = false; resetAllStats(); }
});

/* ===================== INIT ===================== */
(async function init(){
  render();
  try{ await Promise.all([ loadAllStats(), loadMissed() ]); }catch(e){}
  if (state.view === "home") render();
})();

if ("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{ /* not hosted yet, ignore */ });
  });
}
</script>
</body>
